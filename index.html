
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Surprise For You 💗</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="floating-hearts">💗 🤍 🌸 ♡ 🌷 💕</div>

    <main class="welcome-card">
        <p class="little-title">♡ MADE WITH LOVE ♡</p>

        <h1>Hey, handsome! 💗</h1>

        <p class="intro">
            Before you conquer those exams, someone has
            a little surprise waiting just for you. 🥹
        </p>

        <div class="photo-frame">
            <img src="intro.jpeg"
                 alt="Him holding Dimpho the bear">
        </div>

        <h2>Meet you and Dimpho! 🧸</h2>

        <p class="question">
            But first, tell me who just arrived. 👀
        </p>

        <input type="text" id="hisName"
               placeholder="Enter your name, handsome...">

        <button onclick="goToPage2()">
            Open your surprise 💌
        </button>

        <p id="greeting"></p>

        <p class="footer">
            🌸 A little pink, a little love, a lot of YOU. 🌸
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
